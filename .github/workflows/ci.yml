name: CI

# The merge gate for pull requests. Unlike week-check.yml (which probes the
# already-deployed site on a schedule and never checks out this repo), this
# runs against the pull request's own code, so it can actually stop a change
# that breaks the build from reaching main.
#
# The build is self-contained: prerender.js reads no environment variables
# and makes no network calls, so no secrets are needed here.

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      # Advisory for now: the existing codebase has not been linted under a
      # gate, so a pre-existing violation should not block every PR on day
      # one. Drop this line once eslint reports clean.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

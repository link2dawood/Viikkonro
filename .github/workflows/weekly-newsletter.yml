name: Weekly Newsletter Reminder

# Sends the weekly week-change reminder email every Monday morning
# to all subscribers in the Mailjet contact list.

on:
  schedule:
    # 04:00 UTC every Monday = 06:00/07:00 Helsinki local time
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  send-weekly-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Send weekly email
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ vars.MAILJET_FROM_EMAIL || 'hi@viikkonro.fi' }}
          MAILJET_NEWSLETTER_LIST_ID: ${{ vars.MAILJET_NEWSLETTER_LIST_ID || '10712227' }}
        run: node scripts/send-weekly-newsletter.js

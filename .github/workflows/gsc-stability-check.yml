name: GSC traffic and crawl stability monitor

on:
  schedule:
    # Search Console final data normally trails real time by several days.
    - cron: "40 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Require Search Console credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "::error::GCP_SA_KEY is not configured; GSC monitoring cannot run."
            exit 1
          fi

      - name: Check latest finalized traffic
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
          GSC_IMPRESSIONS_MIN: "3500"
          GSC_IMPRESSIONS_MAX: "5500"
          GSC_CLICKS_MIN: "30"
        run: npm run check:traffic

      - name: Check crawl and indexing of core landing pages
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          year=$(TZ="Europe/Helsinki" date +%Y)
          node src/cli.js inspect \
            "/tulosta-$year" \
            "/tyopaivat-$year" \
            "/vuosi-$year"

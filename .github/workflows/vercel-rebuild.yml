name: Daily rebuild (Vercel)

# Vercel auto-deploys on every push to main. This cron additionally rebuilds
# right after midnight in Helsinki so the baked-in current week number / date
# in the home page's <title>, <meta description> and hero stays fresh as the
# day and ISO week roll over — without needing a code change. Two runs cover
# both offsets: 21:05 UTC is 00:05 in summer (EEST, UTC+3), 22:05 UTC is 00:05
# in winter (EET, UTC+2); the other run of each pair is a harmless extra
# rebuild. The build itself runs in Europe/Helsinki time (prerender-tz.js),
# so a build starting at 00:05 Helsinki already sees the new day even though
# UTC is still on the previous one. Pages opened before the new deploy lands
# still show the right day: useToday() switches to the live date right after
# hydration.
#
# Setup: in Vercel -> Project -> Settings -> Git -> Deploy Hooks, create a hook
# for the `main` branch, then add its URL as the repo secret VERCEL_DEPLOY_HOOK.

on:
  schedule:
    - cron: "5 21,22 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret not set — see the setup note in this workflow."
            exit 1
          fi
          curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "Triggered Vercel rebuild."

      # Carried over from the retired Docker/Traefik deploy.yml, which used to
      # run this after the server pulled the new image. Best-effort only: this
      # must never fail the workflow. Vercel deploys asynchronously in the
      # background after the hook above, and Google re-crawls known sitemaps
      # on its own schedule anyway — a missed or slightly-early submission
      # here is low-stakes (see F-08).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Submit sitemap to Search Console
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "::warning::GCP_SA_KEY secret not set — skipping Search Console sitemap submission (see F-07)."
            exit 0
          fi
          node src/cli.js submit-sitemap
